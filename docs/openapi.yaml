openapi: 3.1.0
info:
  title: ATLAS Engineering Workspace API
  version: 0.2.0
  description: Local educational simulation. Integer minor units, no real payment
    credentials. Keys are merchant-scoped across all command types and are retained
    indefinitely. Successful replays return the exact original payment snapshot.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /api/payments:
    get:
      operationId: history
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Snapshot of a bounded history page, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - size
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: authorize
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - merchantId
              - amountMinor
              - currency
              properties:
                merchantId:
                  type: string
                  const: merchant_demo
                amountMinor:
                  $ref: '#/components/schemas/MinorAmount'
                currency:
                  $ref: '#/components/schemas/Currency'
      responses:
        '201':
          $ref: '#/components/responses/CommandResult'
        '200':
          $ref: '#/components/responses/Replay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/payments/{id}:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    get:
      operationId: paymentDetail
      responses:
        '200':
          description: Payment, audit timeline and paired postings in one database
            snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - payment
                - events
                - postings
                properties:
                  payment:
                    $ref: '#/components/schemas/Payment'
                  events:
                    type: array
                    items:
                      type: object
                      required:
                      - sequence
                      - type
                      - detail
                      - correlationId
                      - createdAt
                      properties:
                        sequence:
                          type: integer
                          format: int64
                        type:
                          type: string
                        detail:
                          type: string
                        correlationId:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                  postings:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - kind
                      - debitAccount
                      - creditAccount
                      - amountMinor
                      - currency
                      - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        kind:
                          type: string
                          enum:
                          - CAPTURE
                          - REFUND
                        debitAccount:
                          type: string
                        creditAccount:
                          type: string
                        amountMinor:
                          $ref: '#/components/schemas/MinorAmount'
                        currency:
                          $ref: '#/components/schemas/Currency'
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/payments/{id}/capture:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: capture
      description: Full capture of an AUTHORIZED payment. Atomically writes state,
        ledger, audit, and response.
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/payments/{id}/refund:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: refund
      description: Positive partial or full refund up to the remaining captured amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - amountMinor
              properties:
                amountMinor:
                  $ref: '#/components/schemas/MinorAmount'
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/payments/{id}/reverse:
    parameters:
    - $ref: '#/components/parameters/PaymentId'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: reverse
      description: Release an AUTHORIZED payment. No ledger movement.
      responses:
        '200':
          $ref: '#/components/responses/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/ledger/reconciliation:
    get:
      operationId: reconcile
      responses:
        '200':
          description: Computed per-currency totals and payment-to-posting mismatches.
            No automatic repair.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - currency
                  - debitsMinor
                  - creditsMinor
                  - unbalancedPayments
                  - postingCount
                  - balanced
                  properties:
                    currency:
                      $ref: '#/components/schemas/Currency'
                    debitsMinor:
                      type: integer
                      format: int64
                    creditsMinor:
                      type: integer
                      format: int64
                    unbalancedPayments:
                      type: integer
                      format: int64
                    postingCount:
                      type: integer
                      format: int64
                    balanced:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events:
    get:
      operationId: deliveryEvents
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Newest outbox envelopes and current delivery state in one snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - page
                - size
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryEvent'
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events/{id}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      operationId: deliveryDetail
      responses:
        '200':
          $ref: '#/components/responses/DeliveryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/events/{id}/redeliver:
    parameters:
    - $ref: '#/components/parameters/EventId'
    post:
      operationId: redeliver
      description: Worker must be paused. Resets a delivered/dead event to pending
        with fault NONE and attempts zero. Retains the original envelope, inbox and
        timeline. Repeating while pending returns 409.
      responses:
        '200':
          $ref: '#/components/responses/DeliveryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/worker:
    get:
      operationId: workerControl
      responses:
        '200':
          $ref: '#/components/responses/WorkerControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: setWorkerRunning
      description: Persist the single local worker's running/paused setting. Pausing
        prevents new scheduled claims; an in-flight consumer can finish. Startup preserves
        the setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - running
              properties:
                running:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/WorkerControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/worker/step:
    post:
      operationId: stepWorker
      description: Worker must be paused. Advance the logical clock and claim at most
        one ready event. Omit eventId to choose the oldest ready event. Not idempotent;
        inspect clock/state after a lost response before stepping again. Ticks are
        simulation units, not seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - advanceTicks
              properties:
                eventId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                advanceTicks:
                  type: integer
                  minimum: 1
                  maximum: 16
      responses:
        '200':
          description: Step observation. Inspect persisted event detail for evidence.
          content:
            application/json:
              schema:
                type: object
                required:
                - tick
                - eventId
                - outcome
                - detail
                properties:
                  tick:
                    type: integer
                    format: int64
                  eventId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  outcome:
                    type: string
                    enum:
                    - IDLE
                    - DELIVERED
                    - FENCED
                    - CRASH_BEFORE_COMMIT
                    - CRASH_AFTER_COMMIT
                    - RETRY_SCHEDULED
                    - DEAD_LETTERED
                  detail:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/experiments:
    post:
      operationId: prepareDeliveryExperiment
      description: Worker must be paused for a new experiment. Atomically create a
        12500 USD synthetic authorization, outbox event and fixed fault configuration.
        Existing keys replay the original experiment identity even if the worker later
        runs. Different scenarios using the same key conflict.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 80
          pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - scenario
              properties:
                scenario:
                  $ref: '#/components/schemas/DeliveryFault'
      responses:
        '201':
          $ref: '#/components/responses/ExperimentResult'
        '200':
          $ref: '#/components/responses/ExperimentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /actuator/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Minimal health status
        '503':
          description: A health contributor is down
  /api/workspace/documents:
    get:
      operationId: engineeringDocuments
      description: Most recent 200 records; workspace limit 1000. Export and delete
        records individually.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineeringDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 4
          default: 0
      - name: kind
        in: query
        schema: &id008
          type: string
          enum:
          - DIAGRAM
          - ADR
          - JOURNAL
          - LEARNING
          - POSTMORTEM
          - REVIEW
          - INCIDENT
  /api/workspace/documents/{id}:
    put:
      operationId: saveEngineeringDocument
      description: Create or update an engineer-authored record. INCIDENT is system-managed and returns 400 here; create investigations through the incident runner and record your own analysis in a POSTMORTEM.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineeringDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentWrite'
      parameters: &id001
      - &id006
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteEngineeringDocument
      description: Delete document and all retained revisions. Audit metadata remains;
        no note body is stored in the audit.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: &id003
                    type: boolean
                required:
                - deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters: *id001
  /api/workspace/documents/{id}/revisions:
    get:
      operationId: documentRevisions
      description: Last 20 versions, including the current version. body_json is serialized
        JSON text.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters: *id001
  /api/workspace/audit:
    get:
      operationId: workspaceAudit
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/repository/configuration:
    get:
      operationId: repositoryConfiguration
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/repository/import:
    post:
      operationId: approveRepositoryImport
      description: 'Read-only Git root relative to configured allowlist root; approved
        must be true. No repository commands are executed during indexing. Limits:
        500 source files, 4 MB total, 160000 bytes/file, 5000 visited entries, depth 18.
        One active local worker, no queue. A twelve-second processing budget covers draft
        construction and waiting for the approval audit. Only the waiting request can
        publish; timeout, interruption or supersession preserves any newer state.
        Ignored interruption retains worker admission until actual exit. Approval audit
        records an attempted import, not guaranteed publication.'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositorySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: LOCAL_IMPORT_BUSY while a worker remains active, or local request budget exhausted
        '503':
          description: LOCAL_IMPORT_TIMEOUT when the processing budget expires, LOCAL_IMPORT_INTERRUPTED without publication, or transient database unavailability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  minLength: 1
                  maxLength: 200
                approved: *id003
              required:
              - path
              - approved
  /api/repository/github:
    post:
      operationId: approvePublicGitHubImport
      description: Anonymous public GitHub source import after explicit approval. Resolves the default branch to a full commit SHA, validates the single GitHub archive redirect, reads ZIP entries in memory and publishes atomically. No credentials, repository execution, dependency installation or model transmission. Local Git inspection is replaced by commit provenance for this source kind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, approved]
              properties:
                url:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: Canonical HTTPS github.com/owner/repository root URL, optionally .git or a trailing slash; no credentials, port, query, fragment or branch path.
                directory:
                  type: string
                  maxLength: 200
                  default: ''
                  description: Optional exact relative source subfolder. Source paths retain this prefix. Scope does not reduce whole-archive download/decompression limits.
                approved: {type: boolean, const: true}
      responses:
        '200':
          description: Approved redacted snapshot with pinned source provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositorySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Public repository unavailable; private repositories are unsupported
        '409':
          description: Import superseded by deletion or another successful import
        '429':
          description: GitHub anonymous request denied/rate limited, another download in progress, or local request budget exhausted
        '502':
          description: Bounded upstream request, response, archive or redirect validation failed; previous snapshot retained
  /api/repository:
    get:
      operationId: repositorySnapshot
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositorySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
    delete:
      operationId: deleteRepositorySnapshot
      description: Clear snapshot/root and advance the revision before recording deletion audit. Pending drafts cannot publish afterward. If the audit response fails, in-memory deletion may already have taken effect; refresh repository state. The audit remains subject to database timeouts.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: *id003
                required:
                - deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/repository/file:
    get:
      operationId: repositoryFile
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters: &id005
      - name: path
        in: query
        required: true
        schema: &id004
          type: string
  /api/repository/git:
    get:
      operationId: repositoryGitEvidence
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  history: *id004
                  changes: *id004
                required:
                - history
                - changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters: *id005
  /api/assistant/configuration:
    get:
      operationId: assistantConfiguration
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/assistant/preview:
    post:
      operationId: previewAssistantContext
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1500
              required:
              - question
  /api/assistant:
    post:
      operationId: engineeringAssistant
      description: No model by default. Provider transmission requires useProvider=true,
        approved=true and exact question/snapshot/content-bound citation IDs from preview; provider
        failure or invalid citations returns local evidence.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineeringAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ask'
  /api/assistant/incidents/{id}/summary:
    get:
      operationId: summarizeSavedIncident
      description: Deterministic no-model summary of saved synthetic investigation samples and retained spans. Does not retrieve journal/postmortem text, quote hypotheses as facts, execute commands or call providers. Citations are bounded; legacy unavailable evidence is explicit. Deletion removes availability.
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Calculated measurements, bounded trace/span citations and evidence limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Local request budget exhausted
  /api/observability/metrics:
    get:
      operationId: measuredMetrics
      description: Global JVM-lifetime counters with retained global latency samples, plus fixed operation/family measurements. At most 92 operation labels retain 100 completed latency samples each; start-time windows and lifetime counters are separate. Raw paths, IDs, queries and bodies are not labels. Payment authorization/detail/capture/refund/reversal are distinct; other operations use families.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpMetrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/observability/traces:
    get:
      operationId: retainedOtelSpans
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceSpan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/observability/incidents:
    post:
      operationId: controlledInvestigation
      description: Bounded controlled investigation; connection exhaustion uses an isolated one-slot PostgreSQL pool.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '503':
          description: Isolated database probe initialization unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: &id009
                  - SLOW_QUERY
                  - LOCK_CONTENTION
                  - DOWNSTREAM_TIMEOUT
                  - CONNECTION_EXHAUSTION
                  - EXCESSIVE_RETRIES
                  - CACHE_MISSES
                  - QUEUE_BACKLOG
                  - MISCONFIGURED_TIMEOUT
              required:
              - scenario
  /api/observability/incidents/{id}/evidence:
    get:
      operationId: savedIncidentEvidence
      description: Immutable bounded sample spans and investigation snapshot. Older investigations return available=false without reconstructing expired spans. Deleting the workspace investigation cascades to its evidence.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Saved evidence or explicit legacy unavailability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Investigation not found
  /api/simulations:
    post:
      operationId: discreteEventExperiment
      description: Authenticated local engineering workspace operation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: &id011
                  - SAGA_COMPENSATION
                  - CIRCUIT_BREAKER
                  - RATE_LIMIT
                  - BULKHEAD
                  - CACHE_INVALIDATION
                  - OPTIMISTIC_LOCK
                  - PESSIMISTIC_LOCK
                  - SYNC_ASYNC
                  - LOST_RESPONSE
                  - LEDGER_REPAIR
                  - SLO_BUDGET
                  - TIMEOUT_POLICY
                seed:
                  type: integer
                  format: int64
              required:
              - scenario
              - seed
  /api/webhooks/demo/{id}:
    post:
      operationId: signedLoopbackWebhookDemo
      description: Three signed real HTTP deliveries to the fixed loopback receiver.
        Requires an existing outbox event. Never accepts destination URLs.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      parameters: *id001
  /api/webhooks/receive/{id}:
    post:
      operationId: signedLocalWebhookReceiver
      description: HMAC-SHA256(timestamp.eventId.exactBody), API token as local demonstration
        signing key, timestamp at most 300 seconds old or 30 seconds future. Reject
        changed envelope or reused ID with changed bytes. Production signing key separation
        is required before external delivery.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
      parameters:
      - *id006
      - name: X-Atlas-Timestamp
        in: header
        required: true
        schema: *id004
      - name: X-Atlas-Signature
        in: header
        required: true
        schema: *id004
  /api/repository/metadata:
    get:
      operationId: repositoryManifestMetadata
      description: Snapshot-bound indexed language inventory, declared npm/Maven/Python/Go
        manifest dependencies, framework signals and top-level folders. No installs,
        builds, entity resolution or network acquisition. Language labels are extensions;
        bytes count redacted UTF-8 text. Unsupported syntax is reported in limitations.
      parameters:
      - name: snapshotId
        in: query
        required: false
        description: Expected approved snapshot. A mismatch returns STALE_SNAPSHOT (409).
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Local request or operation budget exhausted; retry after the
            indicated interval
  /api/repository/architecture:
    get:
      operationId: repositoryArchitectureReview
      description: Bounded Java declaration graph over one approved redacted snapshot, with source-evidenced strongly connected groups and distinct-type coupling counts. No execution, dependency acquisition or model transmission. One analysis runs at a time.
      responses:
        '200':
          description: Partial static evidence with explicit scope and truncation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Analysis or local request budget exhausted
  /api/repository/impact:
    post:
      operationId: repositoryChangeImpact
      description: Reverse reachability through the bounded approved Java declaration graph. One deterministic shortest source-evidence path per dependent type; no runtime blast-radius, test-coverage or defect assertion. Shares the architecture-analysis concurrency budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshotId, paths]
              properties:
                snapshotId: {type: string, format: uuid}
                paths:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {type: string, minLength: 1, maxLength: 300}
                  description: Exact paths in the approved snapshot. Duplicates count toward the request limit and are deduplicated in the report.
      responses:
        '200':
          description: Bounded change-review candidates with explicit omitted evidence and scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImpactReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: NO_INDEX or STALE_SNAPSHOT; refresh and select from the approved snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Architecture analysis or local request budget exhausted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
        pattern: ^[A-Za-z0-9._:-]+$
  schemas:
    IncidentMeasurements:
      type: object
      required: [samples, measuredSamples, failedSamples, medianMs]
      properties:
        samples: {type: integer, minimum: 0, maximum: 128}
        measuredSamples: {type: integer, minimum: 0, maximum: 128}
        failedSamples: {type: integer, minimum: 0, maximum: 128}
        medianMs: {type: [number, 'null'], minimum: 0}
    IncidentSummary:
      type: object
      required: [id, mode, evidenceAvailable, scenario, baseline, affected, affectedMinusBaselineMs, retainedSpans, errorSpans, slowestChild, findings, limitations]
      properties:
        id: {type: string, format: uuid}
        mode: {type: string, const: DETERMINISTIC_SAVED_EVIDENCE}
        evidenceAvailable: {type: boolean}
        scenario: {type: [string, 'null']}
        baseline: {$ref: '#/components/schemas/IncidentMeasurements'}
        affected: {$ref: '#/components/schemas/IncidentMeasurements'}
        affectedMinusBaselineMs: {type: [number, 'null']}
        retainedSpans: {type: integer, minimum: 0, maximum: 128}
        errorSpans: {type: integer, minimum: 0, maximum: 128}
        slowestChild:
          type: [object, 'null']
          properties:
            traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
            spanId: {type: string, pattern: '^[0-9a-f]{16}$'}
            parentId: {type: string, pattern: '^[0-9a-f]{16}$'}
            name: {type: string}
            durationMs: {type: number, minimum: 0}
            status: {type: string, enum: [ERROR, NON_ERROR]}
        findings:
          type: array
          maxItems: 5
          items:
            type: object
            required: [kind, text, citations]
            properties:
              kind: {type: string}
              text: {type: string}
              citations:
                type: array
                maxItems: 3
                items:
                  type: object
                  required: [traceId, spanId, label]
                  properties:
                    traceId: {type: string, pattern: '^[0-9a-f]{32}$'}
                    spanId: {type: [string, 'null'], pattern: '^[0-9a-f]{16}$'}
                    label: {type: string}
        limitations:
          type: array
          items: {type: string}
    HttpMetrics:
      type: object
      required: [since, requests, latencySamples, errorRate, p50Ms, p95Ms, p99Ms, endpointLimits, endpointScope, endpoints]
      properties:
        since: {type: string, format: date-time}
        requests: {type: integer, minimum: 0}
        latencySamples: {type: integer, minimum: 0, maximum: 500}
        errorRate: {type: number, minimum: 0, maximum: 1}
        p50Ms: {type: number}
        p95Ms: {type: number}
        p99Ms: {type: number}
        endpointScope: {type: string}
        endpointLimits:
          type: object
          properties:
            operations: {type: integer, const: 92}
            samplesPerOperation: {type: integer, const: 100}
            totalSamples: {type: integer, const: 9200}
        endpoints:
          type: array
          maxItems: 92
          items:
            type: object
            required: [operation, requests, errors, errorRate, latencySamples, p50Ms, p95Ms, p99Ms, windowStart, windowEnd]
            properties:
              operation: {type: string}
              requests: {type: integer, minimum: 0}
              errors: {type: integer, minimum: 0}
              errorRate: {type: number, minimum: 0, maximum: 1}
              latencySamples: {type: integer, minimum: 1, maximum: 100}
              p50Ms: {type: number}
              p95Ms: {type: number}
              p99Ms: {type: number}
              windowStart: {type: string, format: date-time}
              windowEnd: {type: string, format: date-time}
    DeliveryFault:
      type: string
      enum:
      - NONE
      - CRASH_BEFORE_COMMIT_ONCE
      - CRASH_AFTER_COMMIT_ONCE
      - ALWAYS_FAIL
    DeliveryEvent:
      type: object
      required:
      - eventId
      - paymentId
      - eventType
      - payload
      - status
      - fault
      - attempts
      - nextTick
      - leaseUntilTick
      - effects
      - duplicatesSuppressed
      - createdAt
      properties:
        eventId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        eventType:
          type: string
        payload:
          type: object
          required:
          - schemaVersion
          - paymentId
          - eventType
          - status
          - currency
          - amountMinor
          - capturedMinor
          - refundedMinor
          - paymentVersion
          - correlationId
          properties:
            schemaVersion:
              type: integer
              const: 1
            paymentId:
              type: string
              format: uuid
            eventType:
              type: string
            status:
              type: string
            currency:
              $ref: '#/components/schemas/Currency'
            amountMinor:
              $ref: '#/components/schemas/MinorAmount'
            capturedMinor:
              type: integer
              format: int64
            refundedMinor:
              type: integer
              format: int64
            paymentVersion:
              type: integer
              format: int64
            correlationId:
              type: string
              format: uuid
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - RETRY
          - DELIVERED
          - DEAD
        fault:
          $ref: '#/components/schemas/DeliveryFault'
        attempts:
          type: integer
          minimum: 0
          maximum: 3
        nextTick:
          type: integer
          format: int64
        leaseUntilTick:
          type:
          - integer
          - 'null'
          format: int64
        effects:
          type: integer
          minimum: 0
          maximum: 1
        duplicatesSuppressed:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    MinorAmount:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000000
    Currency:
      type: string
      enum:
      - USD
      - EUR
      - INR
    Payment:
      type: object
      required:
      - id
      - merchantId
      - amountMinor
      - currency
      - status
      - capturedMinor
      - refundedMinor
      - version
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum:
          - AUTHORIZED
          - DECLINED
          - CAPTURED
          - REFUNDED
          - REVERSED
        capturedMinor:
          type: integer
          format: int64
          minimum: 0
        refundedMinor:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    Result:
      type: object
      required:
      - payment
      - replayed
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        replayed:
          type: boolean
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
    SourceContext:
      type: object
      properties:
        id: *id004
        path: *id004
        startLine: &id007
          type: integer
        endLine: *id007
        text: *id004
      required:
      - id
      - path
      - startLine
      - endLine
      - text
    EngineeringDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind: *id008
        title:
          type: string
          maxLength: 120
        version: *id007
        body: *id002
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - kind
      - title
      - version
      - body
      - updatedAt
    DocumentWrite:
      type: object
      properties:
        kind: *id008
        title:
          type: string
          minLength: 1
          maxLength: 120
        expectedVersion:
          type: integer
          minimum: 0
        body:
          type: object
          description: UTF-8 JSON at most 12000 bytes. DIAGRAM requires validated
            nodes, edges and assumptions; at most 24 components and 48 edges. ADR writes require Context, Decision, Alternatives, Tradeoffs, Consequences and Review date as nonblank strings of at most 1200 characters each; Review date is a real yyyy-MM-dd calendar date in years 0001–9999. Existing incomplete ADRs remain readable; updates must complete required fields. Additional bounded legacy fields remain allowed.
      required:
      - kind
      - title
      - expectedVersion
      - body
    RepositoryMetadata:
      type: object
      required: [snapshotId, modules, languages, dependencies, signals, limitations]
      properties:
        snapshotId: {type: string, format: uuid}
        modules:
          type: array
          items: {type: string}
          description: Indexed top-level folders; deployment boundaries are not inferred.
        languages:
          type: array
          items:
            type: object
            required: [language, files, lines, contentBytes, paths]
            properties:
              language: {type: string, description: Indexed filename extension.}
              files: {type: integer, minimum: 0, maximum: 500}
              lines: {type: integer, minimum: 0, format: int64}
              contentBytes: {type: integer, minimum: 0, format: int64, description: UTF-8 bytes after redaction.}
              paths:
                type: array
                maxItems: 500
                items: {type: string}
        dependencies:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [ecosystem, name, declaredVersion, path, line]
            properties:
              ecosystem: {type: string}
              name: {type: string, maxLength: 500}
              declaredVersion: {type: string, maxLength: 2000, description: Literal declaration; never resolved or installed.}
              path: {type: string, description: Exact indexed manifest path.}
              line: {type: integer, minimum: 0, description: Exact Python/Go declaration line; zero denotes file-level npm/Maven evidence.}
        signals:
          type: array
          items: {type: string}
        limitations:
          type: array
          items: {type: string}
    RepositoryOrigin:
      type: object
      properties:
        kind: {type: string, enum: [LOCAL, GITHUB]}
        repositoryUrl: {type: string, description: Canonical public GitHub repository URL for GITHUB; empty for LOCAL.}
        commit: {type: string, description: Pinned full 40-hex commit for GITHUB; empty for LOCAL.}
        directory: {type: string, description: Selected GitHub subdirectory or empty for the whole repository or LOCAL.}
      required: [kind, repositoryUrl, commit, directory]
    RepositorySnapshot:
      type: object
      properties:
        id: *id004
        files:
          type: array
          items:
            type: object
            properties:
              path: *id004
              language: *id004
              lines: *id007
              content: *id004
              warnings:
                type: array
                items: *id004
            required:
            - path
            - language
            - lines
            - content
            - warnings
        symbols:
          type: array
          items:
            type: object
            properties:
              path: *id004
              line: *id007
              endLine: *id007
              name: *id004
              kind: *id004
              detail: *id004
            required:
            - path
            - line
            - endLine
            - name
            - kind
            - detail
        edges:
          type: array
          items: *id002
        calls:
          type: array
          items: *id002
        findings:
          type: array
          items: *id004
        languages:
          type: object
          additionalProperties: *id007
        bytes: *id007
        origin:
          $ref: '#/components/schemas/RepositoryOrigin'
      required:
      - id
      - files
      - symbols
      - edges
      - calls
      - findings
      - languages
      - bytes
      - origin
    Ask:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1500
        useProvider: *id003
        approved: *id003
        approvedIds:
          type: array
          maxItems: 5
          items: *id004
      required:
      - question
      - useProvider
      - approved
    EngineeringAnswer:
      type: object
      properties:
        mode:
          type: string
          enum:
          - LOCAL_EVIDENCE
          - PROVIDER
        answer: *id004
        citations:
          type: array
          items:
            $ref: '#/components/schemas/SourceContext'
        uncertainty:
          type: array
          items: *id004
      required:
      - mode
      - answer
      - citations
      - uncertainty
    TraceSpan:
      type: object
      properties:
        traceId: *id004
        spanId: *id004
        parentId: *id004
        name: *id004
        durationMs:
          type: number
        status: *id004
        correlationId: *id004
        startedAt:
          type: string
          format: date-time
      required:
      - traceId
      - spanId
      - parentId
      - name
      - durationMs
      - status
      - correlationId
      - startedAt
    Investigation:
      type: object
      properties:
        id: *id004
        scenario:
          type: string
          enum: *id009
        baseline:
          type: array
          items: &id010
            type: object
            properties:
              traceId: *id004
              durationMs:
                type: number
              outcome: *id004
            required:
            - traceId
            - durationMs
            - outcome
        affected:
          type: array
          items: *id010
        hypothesis: *id004
        validation: *id004
        scope: *id004
      required:
      - id
      - scenario
      - baseline
      - affected
      - hypothesis
      - validation
      - scope
    ArchitectureReference:
      type: object
      properties:
        from: {type: string}
        to: {type: string}
        path: {type: string}
        line: {type: integer, minimum: 1}
      required: [from, to, path, line]
    ArchitectureDeclaration:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        path: {type: string}
        line: {type: integer, minimum: 1}
        fanIn: {type: integer, minimum: 0}
        fanOut: {type: integer, minimum: 0}
      required: [id, name, path, line, fanIn, fanOut]
    ChangeImpactReport:
      type: object
      properties:
        snapshotId: {type: string, format: uuid}
        selectedPaths: {type: array, maxItems: 20, items: {type: string}}
        seeds:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ArchitectureDeclaration'
        affected:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              type:
                $ref: '#/components/schemas/ArchitectureDeclaration'
              distance: {type: integer, minimum: 1}
              changedTypeId: {type: string}
              path:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/ArchitectureReference'
                description: Edges start at the candidate and proceed toward its selected seed. A truncated path ends before that seed; distance retains the full shortest length.
              pathTruncated: {type: boolean}
            required: [type, distance, changedTypeId, path, pathTruncated]
        totalAffected: {type: integer, minimum: 0, maximum: 1000}
        unrepresentedPaths: {type: array, maxItems: 20, items: {type: string}}
        unresolvedFields: {type: integer, minimum: 0}
        skippedFiles: {type: integer, minimum: 0}
        graphTruncated:
          type: boolean
          description: Inherits the architecture report flag, including cycle/coupling display caps; not a precise classification of missing graph facts.
        resultsTruncated:
          type: boolean
          description: More than 200 candidates, or at least one returned evidence path exceeds 20 edges.
        limitations: {type: array, items: {type: string}}
      required: [snapshotId, selectedPaths, seeds, affected, totalAffected, unrepresentedPaths, unresolvedFields, skippedFiles, graphTruncated, resultsTruncated, limitations]
    ArchitectureReview:
      type: object
      properties:
        snapshotId: {type: string, format: uuid}
        types:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ArchitectureDeclaration'
        relationships:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/ArchitectureReference'
        cycles:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              members: {type: array, items: {type: string}}
              evidence:
                type: array
                maxItems: 40
                items:
                  $ref: '#/components/schemas/ArchitectureReference'
              evidenceTruncated: {type: boolean}
            required: [members, evidence, evidenceTruncated]
        hotspots:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              typeId: {type: string}
              fanIn: {type: integer, minimum: 0}
              fanOut: {type: integer, minimum: 0}
              evidence:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/ArchitectureReference'
              evidenceTruncated: {type: boolean}
            required: [typeId, fanIn, fanOut, evidence, evidenceTruncated]
        unresolvedFields: {type: integer, minimum: 0}
        skippedFiles: {type: integer, minimum: 0}
        truncated: {type: boolean}
        limitations: {type: array, items: {type: string}}
      required: [snapshotId, types, relationships, cycles, hotspots, unresolvedFields, skippedFiles, truncated, limitations]
    IncidentEvidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        available:
          type: boolean
        investigation:
          anyOf:
          - $ref: '#/components/schemas/Investigation'
          - type: 'null'
        spans:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/TraceSpan'
        truncated:
          type: boolean
        scope:
          type: string
      required: [id, available, investigation, spans, truncated, scope]
    SimulationResult:
      type: object
      properties:
        scenario:
          type: string
          enum: *id011
        seed:
          type: integer
          format: int64
        before: *id002
        after: *id002
        timeline:
          type: array
          items:
            type: object
            properties:
              tick: *id007
              action: *id004
              evidence: *id004
            required:
            - tick
            - action
            - evidence
        invariant: *id003
        explanation: *id004
        scope: *id004
      required:
      - scenario
      - seed
      - before
      - after
      - timeline
      - invariant
      - explanation
      - scope
  responses:
    DeliveryDetail:
      description: Event plus its latest 100 timeline entries, displayed oldest to
        newest
      content:
        application/json:
          schema:
            type: object
            required:
            - event
            - timeline
            properties:
              event:
                $ref: '#/components/schemas/DeliveryEvent'
              timeline:
                type: array
                maxItems: 100
                items:
                  type: object
                  required:
                  - sequence
                  - tick
                  - attempt
                  - kind
                  - detail
                  - createdAt
                  properties:
                    sequence:
                      type: integer
                      format: int64
                    tick:
                      type: integer
                      format: int64
                    attempt:
                      type: integer
                    kind:
                      type: string
                    detail:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
    WorkerControl:
      description: Persisted clock/setting and real aggregate queue counts
      content:
        application/json:
          schema:
            type: object
            required:
            - tick
            - running
            - pending
            - processing
            - retry
            - delivered
            - dead
            - effects
            properties:
              tick:
                type: integer
                format: int64
              running:
                type: boolean
              pending:
                type: integer
                format: int64
              processing:
                type: integer
                format: int64
              retry:
                type: integer
                format: int64
              delivered:
                type: integer
                format: int64
              dead:
                type: integer
                format: int64
              effects:
                type: integer
                format: int64
    ExperimentResult:
      description: Stable experiment identity, with a replay marker
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - eventId
            - scenario
            - replayed
            properties:
              id:
                type: string
                format: uuid
              eventId:
                type: string
                format: uuid
              scenario:
                $ref: '#/components/schemas/DeliveryFault'
              replayed:
                type: boolean
    CommandResult:
      description: Successful command or exact response replay (check replayed).
      headers:
        Idempotency-Replayed:
          schema:
            type: boolean
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Replay:
      description: Original successful response returned without new business effects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    BadRequest:
      description: Invalid JSON, fields, identifier, pagination or key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state, excess refund, key conflict, running worker during
        manual control, or an event not eligible for redelivery.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource does not exist or its saved investigation was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
