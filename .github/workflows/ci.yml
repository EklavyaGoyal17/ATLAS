name: Verify ATLAS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: atlas_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-local-only
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - name: Build and start the real Compose application
        run: |
          docker compose --env-file .env.example up --build -d db api console
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then exit 0; fi
            sleep 1
          done
          docker compose --env-file .env.example logs
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
        env:
          ATLAS_E2E_EXTERNAL: "true"
      - name: Verify recovery across API container restart
        env:
          ATLAS_API_TOKEN: atlas-local-development-token-change-me
        run: node scripts/recovery-check.mjs
      - name: Verify approved Git history and diff against actual API
        env:
          ATLAS_API_TOKEN: atlas-local-development-token-change-me
        run: node scripts/git-evidence-check.mjs
      - name: Verify PostgreSQL logical backup and restore using synthetic fixtures
        run: node scripts/restore-drill.mjs
      - name: Scan the actual API runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: atlas-api:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Scan the actual console runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: atlas-console:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Save Compose logs
        if: always()
        run: docker compose --env-file .env.example logs > /tmp/atlas-compose.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: verification-evidence
          path: |
            backend/target/surefire-reports
            frontend/test-results
            /tmp/atlas-compose.log
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file .env.example down
  vulnerability-scan:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Resolve the source dependency graph using Maven's cache
        run: mvn -B -f backend/pom.xml -DskipTests compile
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
          TRIVY_SKIP_DIRS: .runtime,.git,frontend/node_modules,backend/target,frontend/dist
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
