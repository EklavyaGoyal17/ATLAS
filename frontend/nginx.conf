server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Public imports include bounded metadata, archive and parser stages.
    # Keep the longer budget confined to this explicitly approved operation.
    location = /api/repository/github {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $atlas_api http://api:8080;
        proxy_pass $atlas_api;
        proxy_set_header Host $host;
        proxy_read_timeout 95s;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $atlas_api http://api:8080;
        proxy_pass $atlas_api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
